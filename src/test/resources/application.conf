ktor {
    deployment {
        port = 0
    }
    application {
        modules = [ com.calmcut.ApplicationKt.module ]
    }
}

database {
    jdbcUrl = "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    driverClassName = "org.h2.Driver"
    username = "sa"
    password = ""
    maximumPoolSize = 5
}

redpanda {
    bootstrapServers = "localhost:9092"
    consumerGroupId = "storyboard-risk-worker-test"
    topicEvents = "storyboard-events-test"
    topicAnalysisResults = "storyboard-analysis-results-test"
    topicDeadLetter = "storyboard-dead-letter-test"
}

analysis {
    ruleVersion = "1.0.0"
    windowSizeSeconds = 60
    maxReversalsPerWindow = 6
    consecutiveHighStimulus = 3
    highStimulusThreshold = 5
    minAverageShotSeconds = 3.0
    bufferStimulusThreshold = 2
    workerPoolSize = 2
    driftCheckIntervalSeconds = 3600
}

import {
    batchSize = 100
    maxConcurrentJobs = 1
}
