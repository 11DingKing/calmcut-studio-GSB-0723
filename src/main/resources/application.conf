ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.calmcut.ApplicationKt.module ]
    }
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5432/storyboard_risk"
    jdbcUrl = ${?DATABASE_URL}
    driverClassName = "org.postgresql.Driver"
    username = "storyboard"
    username = ${?DATABASE_USER}
    password = "storyboard"
    password = ${?DATABASE_PASSWORD}
    maximumPoolSize = 20
}

redpanda {
    bootstrapServers = "localhost:9092"
    bootstrapServers = ${?REDPANDA_BOOTSTRAP_SERVERS}
    consumerGroupId = "storyboard-risk-worker"
    topicEvents = "storyboard-events"
    topicAnalysisResults = "storyboard-analysis-results"
    topicDeadLetter = "storyboard-dead-letter"
}

analysis {
    ruleVersion = "1.0.0"
    windowSizeSeconds = 60
    maxReversalsPerWindow = 6
    consecutiveHighStimulus = 3
    highStimulusThreshold = 5
    minAverageShotSeconds = 3.0
    bufferStimulusThreshold = 2
    workerPoolSize = 4
    driftCheckIntervalSeconds = 3600
}

import {
    batchSize = 1000
    maxConcurrentJobs = 2
}
