ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.calmcut.studio.ApplicationKt.module ]
    }
}

storyboard {
    database {
        jdbcUrl = "jdbc:postgresql://localhost:5432/calmcut"
        jdbcUrl = ${?DB_JDBC_URL}
        username = "calmcut"
        username = ${?DB_USERNAME}
        password = "calmcut"
        password = ${?DB_PASSWORD}
        maxPoolSize = 10
        maxPoolSize = ${?DB_MAX_POOL_SIZE}
    }

    kafka {
        bootstrapServers = "localhost:9092"
        bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
        eventsTopic = "storyboard.events"
        eventsTopic = ${?KAFKA_EVENTS_TOPIC}
        resultsTopic = "storyboard.analysis.results"
        resultsTopic = ${?KAFKA_RESULTS_TOPIC}
        dlqTopic = "storyboard.events.dlq"
        dlqTopic = ${?KAFKA_DLQ_TOPIC}
        consumerGroup = "storyboard-analysis-worker"
        consumerGroup = ${?KAFKA_CONSUMER_GROUP}
    }

    outbox {
        pollIntervalMs = 500
        pollIntervalMs = ${?OUTBOX_POLL_INTERVAL_MS}
        batchSize = 200
        batchSize = ${?OUTBOX_BATCH_SIZE}
    }

    analysis {
        reversalWindowSeconds = 60
        maxReversalsPerWindow = 6
        consecutiveIntensityThreshold = 5
        consecutiveIntensityCount = 3
        minAverageShotSeconds = 3.0
    }

    import {
        chunkSize = 1000
        chunkSize = ${?IMPORT_CHUNK_SIZE}
    }
}
