ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.calmcut.studio.ApplicationKt.module ]
    }
}

calmcut {
    db {
        jdbcUrl = "jdbc:postgresql://localhost:5432/calmcut"
        jdbcUrl = ${?DB_URL}
        username = "calmcut"
        username = ${?DB_USER}
        password = "calmcut"
        password = ${?DB_PASSWORD}
        maximumPoolSize = 20
        maximumPoolSize = ${?DB_POOL_SIZE}
    }

    kafka {
        bootstrapServers = "localhost:9092"
        bootstrapServers = ${?KAFKA_BOOTSTRAP}
        consumerGroup = "risk-analysis-worker"
        eventsTopic = "storyboard-events"
        resultsTopic = "risk-analysis-results"
        dlqTopic = "storyboard-dlq"
        producerAcks = "all"
        consumerAutoOffsetReset = "earliest"
    }

    analysis {
        ruleVersion = "1.0.0"
        windowSizeSeconds = 60
        maxReversalsPerWindow = 6
        consecutiveIntensityCount = 3
        maxIntensity = 5
        minAvgShotSeconds = 3
        bufferIntensityThreshold = 3
        incrementalMode = true
        driftCheckEnabled = true
        driftCheckSampleRate = 1.0
    }

    import {
        chunkSize = 500
        maxConcurrentChunks = 4
    }

    outbox {
        pollIntervalMs = 100
        batchSize = 100
    }
}
